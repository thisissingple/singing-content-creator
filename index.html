<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲線練功坊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .player-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 40px 36px;
    width: 420px;
    max-width: 100%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .cover {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e94560, #533483);
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
    animation: spin 12s linear infinite paused;
  }
  .cover.playing { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .title {
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  .subtitle {
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .progress-container {
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 4px;
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #e94560, #e9a046);
    border-radius: 2px;
    width: 0%;
    position: relative;
    transition: width 0.1s linear;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -6px; top: -4px;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(233,69,96,0.8);
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    margin-bottom: 24px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .btn {
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,0.55);
    font-size: 18px;
    transition: all 0.2s;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:hover { color: #fff; transform: scale(1.1); }
  .btn-play {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #e94560, #e9a046);
    color: #fff;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(233,69,96,0.5);
  }
  .btn-play:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(233,69,96,0.7); }

  .speed-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.65);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    min-width: 36px;
  }
  .speed-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.4);
    font-size: 15px;
  }
  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
  }

  .loading-msg {
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="player-card">
  <div class="cover" id="cover">🎙️</div>
  <div class="title">聲線練功坊</div>
  <div class="subtitle">Vocal Training Workshop</div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  <div class="time-row">
    <span id="currentTime">0:00</span>
    <span id="duration">--:--</span>
  </div>

  <div class="controls">
    <button class="btn" id="rewindBtn" title="後退15秒">⏪</button>
    <button class="btn btn-play" id="playBtn">▶</button>
    <button class="btn" id="forwardBtn" title="快進15秒">⏩</button>
    <button class="speed-btn" id="speedBtn">1x</button>
  </div>

  <div class="volume-row">
    <span>🔈</span>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
    <span>🔊</span>
  </div>

  <div class="loading-msg" id="loadingMsg"></div>
</div>

<audio id="audio" preload="metadata">
  <source src="https://raw.githubusercontent.com/thisissingple/singing-content-creator/player-branch/%E8%81%B2%E7%B7%9A%E7%B7%B4%E5%8A%9F%E5%9D%8A.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const cover = document.getElementById('cover');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const volumeSlider = document.getElementById('volumeSlider');
  const speedBtn = document.getElementById('speedBtn');
  const loadingMsg = document.getElementById('loadingMsg');

  const speeds = [0.75, 1, 1.25, 1.5, 2];
  let si = 1;

  function fmt(s) {
    s = Math.floor(s);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = fmt(audio.duration);
    loadingMsg.textContent = '';
  });

  audio.addEventListener('waiting', () => loadingMsg.textContent = '載入中...');
  audio.addEventListener('canplay', () => loadingMsg.textContent = '');

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    currentTimeEl.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    playBtn.textContent = '▶';
    cover.classList.remove('playing');
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
      cover.classList.add('playing');
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      cover.classList.remove('playing');
    }
  });

  progressContainer.addEventListener('click', e => {
    const r = progressContainer.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  volumeSlider.addEventListener('input', () => audio.volume = volumeSlider.value);

  speedBtn.addEventListener('click', () => {
    si = (si + 1) % speeds.length;
    audio.playbackRate = speeds[si];
    speedBtn.textContent = speeds[si] + 'x';
  });

  document.getElementById('rewindBtn').addEventListener('click', () =>
    audio.currentTime = Math.max(0, audio.currentTime - 15));
  document.getElementById('forwardBtn').addEventListener('click', () =>
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 15));
</script>
</body>
</html>
